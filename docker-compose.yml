services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - lms-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lms_rabbitmq
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - lms-network
    
  
  kong:
    image: kong:latest
    container_name: lms_kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"                                    # DB-less mode
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml    # our config file
      KONG_PROXY_LISTEN: "0.0.0.0:3000"                     # client traffic
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"                     # admin REST API
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"                 # Kong Manager UI
      KONG_LOG_LEVEL: notice
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "3000:3000"    # All client API traffic
      - "8001:8001"    # Kong Admin API  → curl http://localhost:8001
      - "8002:8002"    # Kong Manager UI → http://localhost:8002
    volumes:
      - ./api-gateway/kong.yml:/kong/declarative/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - auth-service
      - leave-service
    networks:
      - lms-network
    

  auth-service:
    build: ./auth-service
    container_name: lms-auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      JWT_ISSUER: lms-issuer     # must match consumer key in kong.yml
      SERVICE_NAME: 'auth-service'
      ALLOWED_ORIGINS: '*'
      DB_HOST: 'postgres'
      DB_DATABASE: 'lms_db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'root'
      DB_PORT: 5432
      JWT_SECRET: 'YFPcTxd3arPQZSL8bPLf5sjEVGIrkxEr22pQ5gbzkK0'
      JWT_EXPIRY: '8h'

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms-network
  
  leave-service:
    build: ./leave-service
    container_name: lms-leave-service
    restart: unless-stopped
    # No 'ports' — only reachable via Kong inside lms-network
    environment:
      PORT: 3002
      SERVICE_NAME: 'leave-service'
      ALLOWED_ORIGINS: '*'
      DB_HOST: 'postgres'
      DB_DATABASE: 'lms_db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'root'
      DB_PORT: 5432
      RABBITMQ_URL: 'amqp://user:password@rabbitmq:5672'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lms-network

  notification-service:
    build: ./notification-service
    container_name: lms-notification-service
    restart: unless-stopped
    environment:
      PORT: 3003
      SERVICE_NAME: 'notification-service'
      ALLOWED_ORIGINS: '*'
      DB_HOST: 'postgres'
      DB_DATABASE: 'lms_db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'root'
      DB_PORT: 5432
      RABBITMQ_URL: 'amqp://user:password@rabbitmq:5672'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lms-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  lms-network:
    driver: bridge