_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    host: auth-upstream
    protocol: http
    port: 3001
    routes:
      - name: auth
        paths:
          - /auth
        strip_path: false

  - name: leave-service
    host: leave-upstream
    protocol: http
    port: 3002

    routes:
      - name: leave-health
        paths:
          - /leave/health
        strip_path: false

      - name: leave-api
        paths:
          - /leave
        strip_path: false

        plugins:
          - name: pre-function
            config:
              access:
                - |
                  local auth = kong.request.get_header("authorization")

                  if not auth then
                    return kong.response.exit(401, {
                      success = false,
                      statusCode = 401,
                      errorMessage = "Unauthorized Request"
                    })
                  end

          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

consumers:
  - username: lms-auth
    jwt_secrets:
      - key: lms-issuer              
        algorithm: HS256
        secret: YFPcTxd3arPQZSL8bPLf5sjEVGIrkxEr22pQ5gbzkK0

upstreams:
  - name: auth-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /auth/health
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]    
      passive:
        healthy:
          http_statuses: [200, 201]
          successes: 5
        unhealthy:
          http_failures: 3
          http_statuses: [500, 502, 503, 504]
          timeouts: 3
    targets:
      - target: auth-service.service.consul:3001
        weight: 100

  - name: leave-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /leave/health
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200]

      passive:
        healthy:
          http_statuses: [200, 201]
          successes: 5
        unhealthy:
          http_failures: 3
          http_statuses: [500, 502, 503, 504]
          timeouts: 3
    targets:
      - target: leave-service.service.consul:3002
        weight: 100

plugins:
  - name: opentelemetry
    config:
      endpoint: http://jaeger:4318/v1/traces
      resource_attributes:
        service.name: lms-api-gateway
      batch_flush_delay: 3          

  - name: cors
    config:
      origins:
        - '*'
      methods:
        - GET
        - POST
        - PUT
        - DELETE

  - name: rate-limiting
    config:
      hour: 100
      policy: local
