_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service.service.consul:3001
    routes:
      - name: auth
        paths:
          - /auth
        strip_path: false
  
  - name: leave-service
    url: http://leave-service.service.consul:3002
    routes:
      - name: leave
        paths:
          - /leave
        strip_path: false
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp

consumers:
  - username: lms-auth
    jwt_secrets:
      - key: lms-issuer
        algorithm: HS256
        secret: YFPcTxd3arPQZSL8bPLf5sjEVGIrkxEr22pQ5gbzkK0

plugins:
  - name: cors
    config:
      origins:
      - '*'
      methods:
      - GET
      - POST
      - PUT
      - DELETE
  
  - name: rate-limiting
    config:
      hour: 100
      policy: local
  